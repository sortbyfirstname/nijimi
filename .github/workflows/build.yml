# Tests every push and pull request. On pushes to main, also publishes a GitHub release if
# Cargo.toml's version doesn't have one yet.
#
# To release: bump `version` in Cargo.toml (e.g. 0.1.0 -> 0.2.0), commit, and push to main.
# The release and its v<version> tag are created automatically. Pushes that don't change the
# version just run the tests.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: pwsh

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Test
        run: cargo test --locked

  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check whether this version is already released
        id: version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'nijimi' | Select-Object -ExpandProperty version
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null | Out-Null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            "Release $tag already exists; nothing to publish."
          } else {
            "Publishing new release $tag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "publish=$(if ($exists) { 'false' } else { 'true' })" >> $env:GITHUB_OUTPUT

      - name: Build and package
        if: steps.version.outputs.publish == 'true'
        run: ./scripts/package.ps1

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          gh release create $tag (Get-ChildItem dist -File).FullName `
            --target $env:GITHUB_SHA `
            --title "nijimi $tag" `
            --generate-notes
