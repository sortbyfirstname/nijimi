[package]
name = "um-bee-ants"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[target.'cfg(windows)'.dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }
image = { version = "0.25", default-features = false }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "=3.0.12"

[target.'cfg(windows)'.build-dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Faster-linking profile for day-to-day runs; use `release` for shipped builds.
[profile.dev-release]
inherits = "release"
lto = "thin"
codegen-units = 16
